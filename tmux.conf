# ============================================================
#  tmux.conf - Minimalista, blanco y negro, fondo transparente
# ============================================================

# Terminal
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Numeración
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on
set -g mouse on

# ========== ESTILO: FONDO TRANSPARENTE, SOLO TEXTO ==========

# Bordes de paneles: gris muy tenue
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour245"

# Barra de estado: transparente, texto gris claro
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=default,fg=colour250"   # fondo transparente

# Lado izquierdo: solo el nombre de la sesión (en negrita y blanco)
set -g status-left-length 30
set -g status-left "#[fg=white,bold] #S #[fg=colour238]│"

# Lado derecho: hora y fecha en gris
set -g status-right-length 30
# set -g status-right "#[fg=colour238]│ #[fg=colour245]%H:%M  %d/%m"

# ========== VENTANAS: ACTIVA MÁS CLARA ==========

# Ventana inactiva: gris tenue
set -g window-status-style "bg=default,fg=colour245"
set -g window-status-format "#I:#W"
set -g window-status-separator "  "

# Ventana ACTIVA: texto BLANCO BRILLANTE (más claro) y negrita
set -g window-status-current-style "bg=default,fg=white,bold"
set -g window-status-current-format "#I:#W"

# Barra de modo (copiar, etc.) en gris suave
set -g mode-style "bg=colour238,fg=colour250"

# ========== NAVEGACIÓN VIM ==========

bind-key -r h select-window -t :-
bind-key -r l select-window -t :+

bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r h select-pane -L
bind-key -r l select-pane -R

bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# ========== MODO COPIA VIM ==========

bind-key -T prefix [ copy-mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

bind-key -T copy-mode-vi h send-keys -X cursor-left
bind-key -T copy-mode-vi j send-keys -X cursor-down
bind-key -T copy-mode-vi k send-keys -X cursor-up
bind-key -T copy-mode-vi l send-keys -X cursor-right

bind-key -T copy-mode-vi / command-prompt -p "search:" "send -X search-forward \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -p "search:" "send -X search-backward \"%%%\""
bind-key -T copy-mode-vi n send-keys -X search-again
bind-key -T copy-mode-vi N send-keys -X search-reverse

# ========== COMANDOS ESENCIALES ==========

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key , command-prompt -I "#W" "rename-window '%%'"
bind-key r source-file ~/.tmux.conf \; display-message "✓ Recargado"

# ========== UTILITY (lazygit) ==========
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# ========== TIPS ==========
# Prefijo: Ctrl+B
# Navegación: h/j/k/l entre paneles, h/l entre ventanas
# Dividir: | (vertical), - (horizontal)
# Nueva ventana: c
# Renombrar: ,
# Recargar: r
